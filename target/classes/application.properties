spring.application.name=ronda-api

server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ronda?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:ronda}
spring.datasource.password=${DB_PASSWORD:ronda}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=ronda-secret-key-cambiar-en-produccion-por-una-mas-segura-1234567890
app.jwt.expiration-ms=86400000

# OTP
app.otp.expiration-minutes=10
app.otp.length=6

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
